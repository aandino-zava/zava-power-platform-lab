name: Promote through Power Platform pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage; configure GitHub Environment protection for both names.
        type: choice
        required: true
        options: [uat, prod]
      newVersion:
        description: New four-part solution version, for example 1.0.0.1.
        type: string
        required: true
      currentVersion:
        description: Current version shown by the native Power Platform pipeline.
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: windows-latest
    environment: ${{ inputs.stage }}
    env:
      PP_TENANT_ID: ${{ vars.PP_TENANT_ID }}
      PP_CLIENT_ID: ${{ vars.PP_CLIENT_ID }}
      PP_DEV_URL: ${{ vars.PP_DEV_URL }}
      PP_PIPELINE_HOST_URL: ${{ vars.PP_PIPELINE_HOST_URL }}
      PP_SOLUTION_UNIQUE_NAME: ${{ vars.PP_SOLUTION_UNIQUE_NAME }}
      PP_UAT_STAGE_ID: ${{ vars.PP_UAT_STAGE_ID }}
      PP_PROD_STAGE_ID: ${{ vars.PP_PROD_STAGE_ID }}
      PP_STAGE_NAME: ${{ inputs.stage }}
      PP_NEW_VERSION: ${{ inputs.newVersion }}
      PP_CURRENT_VERSION: ${{ inputs.currentVersion }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "${env:USERPROFILE}\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Authenticate and import source to Dev
        shell: pwsh
        run: |
          if (-not $env:PP_TENANT_ID -or -not $env:PP_CLIENT_ID) { throw 'Configure PP_TENANT_ID and PP_CLIENT_ID GitHub variables and an Entra federated credential for this repository/workflow.' }
          if ($env:PP_NEW_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$' -or $env:PP_CURRENT_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Solution versions must use four numeric components, such as 1.0.0.1.' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          pac auth create --name github-release --tenant $env:PP_TENANT_ID --applicationId $env:PP_CLIENT_ID --githubFederated --environment $env:PP_DEV_URL
          [xml]$solution = Get-Content solutions/LabPipelineDemo/src/Other/Solution.xml -Raw
          $solution.ImportExportXml.SolutionManifest.Version = $env:PP_NEW_VERSION
          $solution.Save((Join-Path (Get-Location) 'solutions/LabPipelineDemo/src/Other/Solution.xml'))
          pac solution pack --folder solutions/LabPipelineDemo/src --zipfile artifacts/LabPipelineDemo.zip --packagetype Unmanaged
          pac solution import --path artifacts/LabPipelineDemo.zip --environment $env:PP_DEV_URL --publish-changes
      - name: Start native pipeline stage
        shell: pwsh
        run: |
          $stageId = if ($env:PP_STAGE_NAME -eq 'prod') { $env:PP_PROD_STAGE_ID } else { $env:PP_UAT_STAGE_ID }
          if (-not $stageId) { throw 'Configure the stage ID for the selected Power Platform pipeline stage.' }
          if (-not $env:PP_PIPELINE_HOST_URL) { throw 'Configure PP_PIPELINE_HOST_URL.' }
          pac pipeline deploy --environment $env:PP_PIPELINE_HOST_URL --solutionName $env:PP_SOLUTION_UNIQUE_NAME --stageId $stageId --currentVersion $env:PP_CURRENT_VERSION --newVersion $env:PP_NEW_VERSION --wait

# Set required reviewers on the GitHub `prod` Environment. The Power Platform
# pipeline's own Prod pre-deployment gate remains the authoritative tenant gate.

